# NOTE: this workflow has not been executed yet (no GitHub access from the authoring
# environment). Treat the first run as its verification and fix what it reports.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets --all-features -- -D warnings

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK; just accept licenses so AGP can fetch missing parts.
      # (android-actions/setup-android@v3 failed here on license acceptance in the first run.)
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v6
      # :app is part of the build, so Gradle needs the Android SDK even for :core:test.
      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Inspect APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          test -s "$APK"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -n1)
          "$AAPT2" dump badging "$APK" | grep -E "^package:|uses-permission"
      - uses: actions/upload-artifact@v4
        with:
          name: lumora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
