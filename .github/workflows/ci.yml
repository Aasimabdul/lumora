# NOTE: this workflow has not been executed yet (no GitHub access from the authoring
# environment). Treat the first run as its verification and fix what it reports.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets --all-features -- -D warnings

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK; just accept licenses so AGP can fetch missing parts.
      # (android-actions/setup-android@v3 failed here on license acceptance in the first run.)
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      # :app is part of the build, so Gradle needs the Android SDK even for :core:test.
      - name: Unit tests
        run: ./gradlew :core:test :app:testStandardDebugUnitTest :app:testNotificationsDebugUnitTest
      - name: Lint
        run: |
          ./gradlew :app:lintStandardDebug :app:lintNotificationsDebug || {
            echo "---- lint report ----"
            find app/build -name 'lint-results-*.txt' -exec cat {} \; || true
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
      - name: Build debug APKs
        run: ./gradlew :app:assembleStandardDebug :app:assembleNotificationsDebug
      - name: Build release variants (unsigned; checks R8 shrinking compiles)
        run: ./gradlew :app:assembleStandardRelease :app:assembleNotificationsRelease
      - name: Inspect APKs
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -n1)
          STD=$(ls app/build/outputs/apk/standard/debug/*.apk | head -n1)
          NOT=$(ls app/build/outputs/apk/notifications/debug/*.apk | head -n1)
          test -s "$STD"; test -s "$NOT"
          for APK in "$STD" "$NOT"; do
            echo "== $APK"
            "$AAPT2" dump badging "$APK" | grep -E "^package:|uses-permission"
          done
          # The standard build must not declare the notification listener (Play Protect blocks it); the notifications build must.
          if "$AAPT2" dump xmltree --file AndroidManifest.xml "$STD" | grep -q "BIND_NOTIFICATION_LISTENER_SERVICE"; then
            echo "standard APK declares the notification listener"; exit 1
          fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$NOT" | grep -q "BIND_NOTIFICATION_LISTENER_SERVICE"
      - uses: actions/upload-artifact@v4
        with:
          name: lumora-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
