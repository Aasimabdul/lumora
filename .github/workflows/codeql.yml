# 'none' build mode saw no Kotlin source in CI, so the project is compiled manually for CodeQL.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build for analysis
        run: ./gradlew --no-daemon :core:compileKotlin :app:compileStandardDebugKotlin :app:compileNotificationsDebugKotlin
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
