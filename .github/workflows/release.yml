# Builds and publishes a GitHub release when a tag like v0.1.0 is pushed.
#
# * If signing secrets are configured, builds the release variant, verifies its signature and
#   publishes it.
# * If not, builds the DEBUG variant (debug-signed, installable) and publishes it ONLY as a
#   clearly labelled pre-release. An unsigned release APK is never published (not installable).
#
# Repository secrets (set by the owner, never committed):
#   LUMORA_KEYSTORE_B64      base64 of the release keystore
#   LUMORA_KEYSTORE_PASSWORD
#   LUMORA_KEY_ALIAS
#   LUMORA_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]
  # Manual run from the Actions tab (branch main): builds the version in app/build.gradle.kts and
  # creates the tag v<versionName> on this commit together with the release. Fails if the tag exists.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      LUMORA_KEYSTORE_PASSWORD: ${{ secrets.LUMORA_KEYSTORE_PASSWORD }}
      LUMORA_KEY_ALIAS: ${{ secrets.LUMORA_KEY_ALIAS }}
      LUMORA_KEY_PASSWORD: ${{ secrets.LUMORA_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve tag
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_NAME="$GITHUB_REF_NAME"
          else
            TAG_NAME="v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" > /dev/null 2>&1; then
              echo "Tag $TAG_NAME already exists. Bump versionName first."; exit 1
            fi
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Tag must match versionName
        run: |
          TAG="${TAG_NAME#v}"
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=$TAG versionName=$VERSION"
          test "$TAG" = "$VERSION"

      - name: Run tests and lint
        run: ./gradlew :core:test :app:testStandardDebugUnitTest :app:testNotificationsDebugUnitTest :app:lintStandardDebug :app:lintNotificationsDebug

      - name: Decode keystore (if provided)
        env:
          KEYSTORE_B64: ${{ secrets.LUMORA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LUMORA_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        run: |
          if [ "$SIGNED" = "true" ]; then
            ./gradlew :app:assembleStandardRelease :app:assembleNotificationsRelease
            echo "VARIANT=release" >> "$GITHUB_ENV"
            echo "SUFFIX=" >> "$GITHUB_ENV"
          else
            ./gradlew :app:assembleStandardDebug :app:assembleNotificationsDebug
            echo "VARIANT=debug" >> "$GITHUB_ENV"
            echo "SUFFIX=-debug" >> "$GITHUB_ENV"
          fi

      - name: Verify APKs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -n1)
          mkdir -p dist
          for FLAVOR in standard notifications; do
            APK=$(ls app/build/outputs/apk/$FLAVOR/$VARIANT/*.apk | head -n1)
            test -s "$APK"
            "$BT/aapt2" dump badging "$APK" | grep -E "^package:"
            "$BT/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verifies|SHA-256 digest|DN" | head -4
            if [ "$FLAVOR" = "standard" ]; then
              if "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q BIND_NOTIFICATION_LISTENER_SERVICE; then
                echo "standard APK must not declare the notification listener"; exit 1
              fi
              cp "$APK" "dist/Lumora-${TAG_NAME}${SUFFIX}.apk"
            else
              "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q BIND_NOTIFICATION_LISTENER_SERVICE
              cp "$APK" "dist/Lumora-${TAG_NAME}-notifications${SUFFIX}.apk"
            fi
          done
          (cd dist && sha256sum *.apk | tee SHA256SUMS.txt)

      - name: Compose release notes
        run: |
          {
            cat docs/RELEASE_NOTES.md
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "**Signed release build.**"
            else
              echo "> **Preview build — signed with the Android *debug* key**, not a production release key. It installs normally, but a later release signed with a different key cannot update over it (uninstall first). Not tested on a physical device by the maintainer at the time of release."
            fi
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS="--prerelease"
          if [ "$SIGNED" = "true" ] && ! grep -q "early preview" docs/RELEASE_NOTES.md; then FLAGS=""; fi
          gh release create "$TAG_NAME" dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Lumora ${TAG_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $FLAGS
